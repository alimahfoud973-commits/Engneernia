name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_marketplace
          TZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and property tests
        run: npm run test

      # The authorization model rests on PostgreSQL role separation and RLS.
      # This proves both against a real database on every push — if a future
      # change weakens them, CI fails here rather than in production.
      - name: Prove database authorization foundation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f docker/postgres/init/01-roles.sql
          psql -h localhost -U postgres -d engineering_marketplace -v ON_ERROR_STOP=1 \
            -f src/db/security/rls-foundation.test.sql

      - name: Apply migrations
        env:
          DATABASE_MIGRATION_URL: postgresql://migrator:migrator_password@localhost:5432/engineering_marketplace
        run: npm run db:migrate

      # Three tests in src/catalog/search.itest.ts assert properties that only
      # exist at scale — a discipline portal capping its preview, a facet
      # offering alternatives, a heavy query staying fast over 5,000 products.
      # Against an empty catalogue they do not pass; they fail, which is the
      # correct answer to "is the page bounded" when there is nothing to bound.
      # So the catalogue is seeded here, exactly as a developer seeds it
      # locally before running the same suite.
      - name: Seed the catalogue
        env:
          DATABASE_URL: postgresql://app_user:app_password@localhost:5432/engineering_marketplace
          DATABASE_MIGRATION_URL: postgresql://migrator:migrator_password@localhost:5432/engineering_marketplace
          SESSION_SECRET: ci-session-secret-value-at-least-32-chars
          CONFIG_ENCRYPTION_KEY: ci-config-encryption-key-at-least-32-chars
          APP_URL: http://localhost:3000
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY_ID: ci
          STORAGE_SECRET_ACCESS_KEY: ci
          STORAGE_BUCKET_ORIGINALS: ci-originals
          STORAGE_BUCKET_DERIVATIVES: ci-derivatives
          MAIL_TRANSPORT_URL: log://ci
          MAIL_FROM: "Engineernia <no-reply@ci.local>"
        run: |
          npm run seed:catalog
          npm run seed:demo
          npm run seed:scale

      # The phase P1 exit criterion. These run every query the way a BUGGY
      # application would write it — no WHERE clause, no policy check — and
      # assert the database returns nothing anyway.
      - name: Integration tests (RLS enforced without the policy layer)
        env:
          DATABASE_URL: postgresql://app_user:app_password@localhost:5432/engineering_marketplace
          DATABASE_MIGRATION_URL: postgresql://migrator:migrator_password@localhost:5432/engineering_marketplace
          DATABASE_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/engineering_marketplace
          SESSION_SECRET: ci-session-secret-value-at-least-32-chars
          CONFIG_ENCRYPTION_KEY: ci-config-encryption-key-at-least-32-chars
          APP_URL: http://localhost:3000
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY_ID: ci
          STORAGE_SECRET_ACCESS_KEY: ci
          STORAGE_BUCKET_ORIGINALS: ci-originals
          STORAGE_BUCKET_DERIVATIVES: ci-derivatives
          # Registration verification mail. The log transport is what CI wants:
          # nothing leaves the runner, and the tests install their own
          # capturing adapter anyway.
          MAIL_TRANSPORT_URL: log://ci
          MAIL_FROM: "Engineernia <no-reply@ci.local>"
        run: npm run test:integration

      - name: Production build
        run: npm run build

      # Fails only on HIGH/CRITICAL. The remaining moderate advisories are
      # confined to drizzle-kit's bundled esbuild, a build-time CLI that never
      # runs in production — documented in docs/DECISIONS.md.
      - name: Dependency audit
        run: npm audit --audit-level=high
