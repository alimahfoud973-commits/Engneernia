# Local development infrastructure.
# Production uses managed equivalents (managed PostgreSQL + Cloudflare R2),
# reached through the same environment variables — nothing in the application
# code is aware of which is running.

services:
  postgres:
    image: postgres:16-alpine
    container_name: em_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: engineering_marketplace
      # Accounting boundaries are computed in application code using
      # PLATFORM_TIMEZONE; the database itself stays in UTC so that
      # timestamps are unambiguous at rest.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d engineering_marketplace']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible private object storage — the protocol Cloudflare R2 speaks in
  # production. Both buckets are private: there is deliberately no public
  # bucket anywhere in this stack.
  #
  # RustFS, the same server GitHub CI runs. It replaced MinIO when MinIO's
  # images stopped being pullable: minio/minio and minio/mc were removed from
  # Docker Hub, and quay.io/minio/* answers 401 Unauthorized. Credentials,
  # ports and bucket names are unchanged, so .env.example still applies.
  # Pinned, so a new release cannot change the stack underneath the code.
  storage:
    image: rustfs/rustfs:1.0.0
    container_name: em_storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: create the two buckets, and make sure neither is public by
  # removing any bucket policy (what `mc anonymous set none` did for MinIO).
  storage_init:
    image: amazon/aws-cli:2.37.4
    container_name: em_storage_init
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -ec "
      for bucket in engineering-originals engineering-derivatives; do
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket $$bucket 2>/dev/null ||
          aws --endpoint-url http://storage:9000 s3api create-bucket --bucket $$bucket;
        aws --endpoint-url http://storage:9000 s3api delete-bucket-policy --bucket $$bucket;
      done;
      echo 'buckets ready and private';
      "

volumes:
  postgres_data:
  storage_data:
