# Local development infrastructure.
# Production uses managed equivalents (managed PostgreSQL + Cloudflare R2),
# reached through the same environment variables — nothing in the application
# code is aware of which is running.

services:
  postgres:
    image: postgres:16-alpine
    container_name: em_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: engineering_marketplace
      # Accounting boundaries are computed in application code using
      # PLATFORM_TIMEZONE; the database itself stays in UTC so that
      # timestamps are unambiguous at rest.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d engineering_marketplace']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible private object storage. Both buckets are private:
  # there is deliberately no public bucket anywhere in this stack.
  minio:
    image: quay.io/minio/minio:latest
    container_name: em_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: create the two private buckets and prove they are private.
  minio_init:
    image: quay.io/minio/mc:latest
    container_name: em_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/engineering-originals;
      mc mb --ignore-existing local/engineering-derivatives;
      mc anonymous set none local/engineering-originals;
      mc anonymous set none local/engineering-derivatives;
      echo 'buckets ready and private';
      "

volumes:
  postgres_data:
  minio_data:
