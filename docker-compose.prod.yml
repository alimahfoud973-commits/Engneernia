# =============================================================================
# SINGLE-SERVER PRODUCTION STACK
# =============================================================================
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# For a VPS, which is the realistic deployment for a platform operated from
# Syria: the large hosting platforms are difficult or impossible to pay for
# from there, and nothing in this application depends on any of them.
#
# WHAT THIS DOES NOT DO, ON PURPOSE:
#   - no TLS. Put a reverse proxy in front (Caddy, nginx). The session cookie
#     is `Secure` and `__Host-`, so over plain HTTP NOBODY CAN SIGN IN — that
#     is the cookie working, not a bug to route around.
#   - no backups. `npm run backup` needs a superuser connection; schedule it on
#     the host with a destination that is NOT this server. See
#     docs/BACKUP-AND-RESTORE.md §6, which is still awaiting the owner's answer
#     on where those copies live.
#   - no database exposed to the internet. `postgres` is published on
#     127.0.0.1 ONLY, so the host's backup cron and `npm run db:prove-rls`
#     can reach it; nothing off this machine can. Never widen that binding.
#   - no unscanned uploads. `clamav` sits on its own network with the app
#     alone: it parses hostile files, so it gets no route to the database.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: engineering_marketplace
      # The database stays in UTC. Accounting months are computed in
      # Asia/Damascus by a trigger, from a UTC timestamp — one clock at rest,
      # one conversion, in one place.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates `app_user` (NOBYPASSRLS) and `migrator`. This runs ONLY on an
      # empty data directory — on an existing volume the roles are already
      # there and this file is ignored.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d engineering_marketplace']
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      # Loopback only — for the tools that run on the host and need a
      # superuser connection: scripts/backup.sh, restore-drill.sh and
      # prove-rls.mjs (none of them is in the app image). A bare '5432:5432'
      # here would publish the database to the internet, and Docker writes
      # its own firewall rules ahead of ufw, so ufw would not stop it.
      - '127.0.0.1:5432:5432'

  # Scans every upload before it is stored (src/media/scanner.ts). Fail-closed
  # is the application's, not this service's: clamd down, slow or unreachable
  # means FAILED, and the upload is refused. Nothing here can turn a missing
  # scan into CLEAN.
  clamav:
    # The Debian variant: it is published for arm64 (Oracle Ampere A1).
    image: clamav/clamav-debian:1.5
    restart: unless-stopped
    volumes:
      # Signatures survive a restart. Re-downloading them on every start is
      # slow, and the ClamAV mirrors rate-limit a server that does it.
      - clamav_db:/var/lib/clamav
      # Size limits for 1 GiB originals; each value is explained in the file.
      - ./deploy/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    # No `ports:`. Reachable only from `app`, on `scanner`.
    networks: [scanner]
    # ~1.2 GiB to hold the signatures, ~2.4 GiB while a reload holds two sets.
    # Killed above this, it fails closed: the upload is refused, not let in.
    mem_limit: 4g
    healthcheck:
      # The image's own check: PING on 3310, expects PONG.
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 3
      # The first start downloads every signature before clamd listens.
      start_period: 10m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Without this an upload made in the first minutes after a restart is
      # refused as FAILED — safe, but it reads as a broken site.
      clamav:
        condition: service_healthy
    networks: [default, scanner]
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:?set APP_URL to the real https origin}
      # MUST be app_user. A higher role here silently disables every row-level
      # policy on the platform — no error, no failing test, just a database
      # whose security model has stopped meaning anything.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (app_user)}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?set DATABASE_MIGRATION_URL (migrator)}
      SESSION_SECRET: ${SESSION_SECRET:?}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?}
      # Not a local path: the application refuses to start in production with
      # file:// storage, because a single-node disk cannot survive the
      # container being replaced and a lost original cannot be recovered.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?}
      STORAGE_BUCKET_ORIGINALS: ${STORAGE_BUCKET_ORIGINALS:-em-originals}
      STORAGE_BUCKET_DERIVATIVES: ${STORAGE_BUCKET_DERIVATIVES:-em-derivatives}
      # Registration verification mail. Without these two the process does
      # not start at all — which is the point: a customer cannot buy before
      # confirming an address (OPEN-23), so a site that cannot send mail is a
      # site that cannot sell. `log://` is refused here as well.
      MAIL_TRANSPORT_URL: ${MAIL_TRANSPORT_URL:?set MAIL_TRANSPORT_URL (smtp:// or smtps://)}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM, on a domain whose SPF and DKIM you control}
      PLATFORM_TIMEZONE: ${PLATFORM_TIMEZONE:-Asia/Damascus}
      PLATFORM_BASE_CURRENCY: ${PLATFORM_BASE_CURRENCY:-USD}
      # Fixed, not read from .env.production: production has no `none`. An
      # upload that cannot be scanned is refused (FAILED), and a SKIPPED file
      # is never served in production (isServable) — this keeps it that way
      # by never producing one here.
      MALWARE_SCANNER: clamav
      # `clamav` is the service above, by its name on the `scanner` network.
      # 127.0.0.1 here would be the app container itself, where nothing listens.
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # `:-` also replaces an EMPTY value. The schema accepts only the level
      # names, so `LOG_LEVEL=` in .env.production would stop the process at boot.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Off until the site is really live, on the real domain. See docs/SEO.md.
      SEO_INDEXABLE: ${SEO_INDEXABLE:-false}
    ports:
      # Bound to loopback: the reverse proxy reaches it, the internet does not.
      - '127.0.0.1:3000:3000'

volumes:
  postgres_data:
  clamav_db:

networks:
  # Not `internal: true`: freshclam inside the clamav container must reach the
  # signature mirrors. What this network buys is that postgres is not on it.
  scanner:
