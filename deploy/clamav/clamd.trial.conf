# =============================================================================
# clamd FOR docker-compose.trial.yml (the laptop trial)
# =============================================================================
# deploy/clamav/clamd.conf, directive for directive, plus ONE line at the end.
# src/lib/config/trial-stack.test.ts fails if any other directive differs,
# so the trial cannot scan more leniently than production: the comments
# below are production's own, and so are the values they explain.
#
# These five reproduce what the clamav/clamav-debian image writes into its own
# copy. The image's entrypoint waits for this socket path and its healthcheck
# pings this port: change either and the container never reports healthy.
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
LogFile /var/log/clamav/clamd.log
LogTime yes

# --- Size limits -------------------------------------------------------------
# The largest upload the application accepts is 1024 MiB (REVIT_BIM, ARCHIVE,
# PROJECT — MAX_UPLOAD_BYTES in src/media/file-types.ts). Both limits sit 1 MiB
# above it, so the ceiling stays the application's, which can say per type
# which limit was exceeded. ClamAV's defaults are 100M for both: every original
# above 100 MB would be refused as FAILED. ClamAV cannot scan above 2 GB.
StreamMaxLength 1025M
MaxFileSize 1025M

# Bytes scanned per file, archive members included. Twice the largest upload:
# an archive that expands beyond it is not fully scanned, and AlertExceedsMax
# below turns that into a refusal instead of a pass.
MaxScanSize 2048M

# THE LINE THAT KEEPS THIS FAIL-CLOSED. ClamAV's default is `no`, under which
# a file over any limit above (or over MaxFiles, MaxRecursion, MaxScanTime) is
# answered `OK` — unscanned, and recorded CLEAN. With `yes` the answer is
# `Heuristics.Limits.Exceeded.<limit> FOUND`, and the upload is refused.
AlertExceedsMax yes

# Stated, not changed. 120 s is ClamAV's default and, in this version, bounds
# ZIP archives only. The application gives up after 120 s of silence on the
# socket (src/media/scanner.ts) for every type. Raise neither before timing a
# 1 GiB scan on the production CPU.
MaxScanTime 120000

# --- The one trial-only line ---------------------------------------------------
# A signature reload normally loads the new set while the old one keeps
# serving, so for a moment clamd holds both (up to ~2.4 GiB in ClamAV's own
# figures). The trial Docker VM has 3.77 GiB for everything. With `no`, clamd
# drops the old set first and blocks scans during the reload; a scan that
# meets the block waits or times out as FAILED — refused, never let in. The
# trial also runs no update daemon (CLAMAV_NO_FRESHCLAMD), so a reload should
# not happen at all; this line is the floor if one does.
ConcurrentDatabaseReload no
